// l4d2_weapon_ff.smx 的各武器友軍傷害倍率設定
//
// 每個數值都是「疊加在遊戲原本友軍傷害之上」的倍率
// (所以也會和 survivor_friendly_fire_factor_* 這些 cvar 一起作用)
//   1.0 = 原版 / 不變(以下預設值全部都是 1.0)
//   0.5 = 一半傷害
//   0.0 = 該來源不造成友軍傷害
//   2.0 = 兩倍傷害
//
// 遊戲內重新讀取:sm_ffreload     列出目前倍率:sm_fflist
// 暫時修改:sm_ffscale <key> <倍率>
// 不確定某個武器的 key 叫什麼?把 l4d2_weapon_ff_debug 設成 1 再打一下隊友,
// 伺服器主控台會印出每次傷害的 key,再把它加到下面的 "Weapons" 裡即可。
// 沒列在表裡的 key 會使用 Options 裡的 default_scale。

"WeaponFF"
{
	"Options"
	{
		"default_scale"		"0.5"	// 沒列在下方表中的武器 / 傷害來源
		"self_scale"		"1.0"	// 倖存者傷到自己時,額外再乘上的倍率

		// 依「攻擊者 → 受害者」是真玩家還是 bot,額外再乘上的倍率(預設 1.0 = 不變)
		// 最終倍率 = 武器倍率 × 下面對應的倍率。傷到自己時只套用 self_scale,不套用這四個
		"player_to_player"	"1.0"	// 真玩家 打 真玩家  
		"player_to_bot"		"2.0"	// 真玩家 打 bot //0.5 X 2.0 = 1.0
	}

	"Weapons"
	{
		// --- 霰彈槍 ---
		"weapon_pumpshotgun"		"0.3"
		"weapon_shotgun_chrome"		"0.3"
		"weapon_autoshotgun"		"0.3"
		"weapon_shotgun_spas"		"0.3"

		// --- 重武器 ---
		"weapon_grenade_launcher"	"0.1" // M79 榴彈發射器
		"weapon_chainsaw"			"0.4" // 電鋸

		// --- 近戰(下方沒有個別列出名稱的近戰武器,會用這個) ---
		"weapon_melee"				"0.4"
	}
}
