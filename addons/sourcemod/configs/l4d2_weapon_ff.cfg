// Per-weapon friendly fire scales for l4d2_weapon_ff.smx
//
// Every value is a multiplier applied ON TOP of the game's normal friendly-fire
// damage (so it also stacks with survivor_friendly_fire_factor_* cvars).
//   1.0 = vanilla / unchanged (all defaults below)
//   0.5 = half damage
//   0.0 = no friendly-fire damage from that source
//   2.0 = double damage
//
// Reload in game with: sm_ffreload      List with: sm_fflist
// Temporary change:    sm_ffscale <key> <scale>
// Not sure what a key is called? Set l4d2_weapon_ff_debug 1 and shoot a teammate;
// the server console prints the key of each hit. Add it under "Weapons".
// Keys that are not listed use Options/default_scale.

"WeaponFF"
{
	"Options"
	{
		"default_scale"		"1.0"	// weapons/sources not listed below
		"self_scale"		"1.0"	// extra multiplier when a survivor hurts himself
	}

	"Weapons"
	{
		// --- Pistols ---
		"weapon_pistol"				"1.0"
		"weapon_pistol_magnum"		"1.0"

		// --- SMGs ---
		"weapon_smg"				"1.0"
		"weapon_smg_silenced"		"1.0"
		"weapon_smg_mp5"			"1.0"

		// --- Shotguns ---
		"weapon_pumpshotgun"		"1.0"
		"weapon_shotgun_chrome"		"1.0"
		"weapon_autoshotgun"		"1.0"
		"weapon_shotgun_spas"		"1.0"

		// --- Rifles ---
		"weapon_rifle"				"1.0"
		"weapon_rifle_ak47"			"1.0"
		"weapon_rifle_desert"		"1.0"
		"weapon_rifle_sg552"		"1.0"
		"weapon_rifle_m60"			"1.0"

		// --- Snipers ---
		"weapon_hunting_rifle"		"1.0"
		"weapon_sniper_military"	"1.0"
		"weapon_sniper_scout"		"1.0"
		"weapon_sniper_awp"			"1.0"

		// --- Heavy ---
		"weapon_grenade_launcher"	"1.0"
		"weapon_chainsaw"			"1.0"

		// --- Melee (fallback for any melee not listed by name below) ---
		"weapon_melee"				"1.0"

		// --- Melee by script name (takes priority over weapon_melee) ---
		"baseball_bat"				"1.0"
		"cricket_bat"				"1.0"
		"crowbar"					"1.0"
		"electric_guitar"			"1.0"
		"fireaxe"					"1.0"
		"frying_pan"				"1.0"
		"golfclub"					"1.0"
		"katana"					"1.0"
		"knife"						"1.0"
		"machete"					"1.0"
		"pitchfork"					"1.0"
		"shovel"					"1.0"
		"tonfa"						"1.0"
		"riotshield"				"1.0"

		// --- Fire / explosives (damage inflictor entities) ---
		"inferno"					"1.0"	// molotov / gascan / fuel barrel fire
		"entityflame"				"1.0"	// burning player
		"pipe_bomb_projectile"		"1.0"
		"molotov_projectile"		"1.0"
		"grenade_launcher_projectile"	"1.0"
		"weapon_gascan"				"1.0"
		"weapon_propanetank"		"1.0"
		"weapon_oxygentank"			"1.0"
		"weapon_fireworkcrate"		"1.0"
		"prop_fuel_barrel"			"1.0"
	}
}
