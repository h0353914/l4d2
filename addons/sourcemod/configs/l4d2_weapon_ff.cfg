// l4d2_weapon_ff.smx 的各武器友軍傷害倍率設定
//
// 每個數值都是「疊加在遊戲原本友軍傷害之上」的倍率
// (所以也會和 survivor_friendly_fire_factor_* 這些 cvar 一起作用)
//   1.0 = 原版 / 不變(以下預設值全部都是 1.0)
//   0.5 = 一半傷害
//   0.0 = 該來源不造成友軍傷害
//   2.0 = 兩倍傷害
//
// 遊戲內重新讀取:sm_ffreload     列出目前倍率:sm_fflist
// 暫時修改:sm_ffscale <key> <倍率>
// 不確定某個武器的 key 叫什麼?把 l4d2_weapon_ff_debug 設成 1 再打一下隊友,
// 伺服器主控台會印出每次傷害的 key,再把它加到下面的 "Weapons" 裡即可。
// 沒列在表裡的 key 會使用 Options 裡的 default_scale。

"WeaponFF"
{
	"Options"
	{
		"default_scale"		"1.0"	// 沒列在下方表中的武器 / 傷害來源
		"self_scale"		"1.0"	// 倖存者傷到自己時,額外再乘上的倍率
	}

	"Weapons"
	{
		// --- 手槍 ---
		"weapon_pistol"				"1.0"
		"weapon_pistol_magnum"		"1.0"

		// --- 衝鋒槍 ---
		"weapon_smg"				"1.0"
		"weapon_smg_silenced"		"1.0"
		"weapon_smg_mp5"			"1.0"

		// --- 霰彈槍 ---
		"weapon_pumpshotgun"		"1.0"
		"weapon_shotgun_chrome"		"1.0"
		"weapon_autoshotgun"		"1.0"
		"weapon_shotgun_spas"		"1.0"

		// --- 步槍 ---
		"weapon_rifle"				"1.0"
		"weapon_rifle_ak47"			"1.0"
		"weapon_rifle_desert"		"1.0"
		"weapon_rifle_sg552"		"1.0"
		"weapon_rifle_m60"			"1.0"

		// --- 狙擊槍 ---
		"weapon_hunting_rifle"		"1.0"
		"weapon_sniper_military"	"1.0"
		"weapon_sniper_scout"		"1.0"
		"weapon_sniper_awp"			"1.0"

		// --- 重武器 ---
		"weapon_grenade_launcher"	"1.0"
		"weapon_chainsaw"			"1.0"

		// --- 近戰(下方沒有個別列出名稱的近戰武器,會用這個) ---
		"weapon_melee"				"1.0"

		// --- 依腳本名稱分的近戰武器(優先於 weapon_melee) ---
		"baseball_bat"				"1.0"
		"cricket_bat"				"1.0"
		"crowbar"					"1.0"
		"electric_guitar"			"1.0"
		"fireaxe"					"1.0"
		"frying_pan"				"1.0"
		"golfclub"					"1.0"
		"katana"					"1.0"
		"knife"						"1.0"
		"machete"					"1.0"
		"pitchfork"					"1.0"
		"shovel"					"1.0"
		"tonfa"						"1.0"
		"riotshield"				"1.0"

		// --- 火焰 / 爆炸物(造成傷害的實體) ---
		"inferno"					"1.0"	// 火瓶 / 汽油桶 / 油桶燃燒的火焰
		"entityflame"				"1.0"	// 身上著火的玩家
		"pipe_bomb_projectile"		"1.0"
		"molotov_projectile"		"1.0"
		"grenade_launcher_projectile"	"1.0"
		"weapon_gascan"				"1.0"
		"weapon_propanetank"		"1.0"
		"weapon_oxygentank"			"1.0"
		"weapon_fireworkcrate"		"1.0"
		"prop_fuel_barrel"			"1.0"
	}
}
